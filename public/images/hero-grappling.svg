<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-label="Illustration : deux pratiquants de Jiu-Jitsu Brésilien, garde assise contre passeur debout">
  <!-- Halo et cercles de tatami -->
  <circle cx="260" cy="250" r="206" fill="#ea580c" opacity="0.06"/>
  <circle cx="260" cy="250" r="206" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.18"/>
  <circle cx="260" cy="250" r="156" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.14"/>
  <circle cx="260" cy="250" r="106" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.10"/>

  <!-- Passeur debout (noir) -->
  <g stroke="#1c1917" stroke-linecap="round" fill="none">
    <path d="M344 142 306 238" stroke-width="34"/>
    <path d="M332 166 238 266" stroke-width="23"/>
    <path d="M324 186 256 292" stroke-width="23"/>
    <path d="M306 238 376 312 380 402" stroke-width="27"/>
    <path d="M306 238 270 322 282 404" stroke-width="27"/>
  </g>
  <circle cx="348" cy="96" r="29" fill="#1c1917"/>

  <!-- Joueur de garde assis (orange) -->
  <g stroke="#ea580c" stroke-linecap="round" fill="none">
    <path d="M130 310 160 386" stroke-width="30"/>
    <path d="M132 320 70 396" stroke-width="20"/>
    <path d="M142 334 236 318" stroke-width="20"/>
    <path d="M160 386 232 344 272 318" stroke-width="24"/>
    <path d="M160 386 248 396 298 388" stroke-width="24"/>
  </g>
  <circle cx="118" cy="276" r="27" fill="#ea580c"/>

  <!-- Ceinture noire au sol, barre orange -->
  <rect x="40" y="412" width="440" height="18" rx="9" fill="#1c1917"/>
  <rect x="408" y="412" width="60" height="18" rx="9" fill="#ea580c"/>
</svg>
